<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YUVATECH traffic control room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#E8ECF0;--ink:#17212B;--muted:#586674;--panel:#fff;--asphalt:#26303A;--amber:#F2B01E;--ok:#1F7A63;--bad:#B93A2B;--line:#CBD3DA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:700;margin:0;line-height:1.1}
h1{font-size:clamp(30px,6vw,46px)}
h2{font-size:24px;margin:32px 0 12px}
.top{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end}
.sub{margin:6px 0 0;color:var(--muted);max-width:60ch}
button{font:600 16px Barlow,system-ui,sans-serif;background:var(--ink);color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#banner{margin:16px 0 0;padding:10px 14px;background:#FFF3CF;border-left:5px solid var(--amber);border-radius:4px}
.road{margin-top:24px;background:var(--asphalt);color:#fff;border-radius:8px;padding:18px 18px 22px}
.road .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:500}
.road .big{font:700 40px 'Barlow Condensed',sans-serif}
.lane{position:relative;height:44px;margin-top:10px}
.lane::before{content:"";position:absolute;left:0;right:0;top:21px;border-top:3px dashed #ffffff55}
.fill{position:absolute;left:0;top:19px;height:6px;background:var(--amber);border-radius:3px;width:0}
.mk{position:absolute;top:8px;width:14px;height:28px;margin-left:-7px;border-radius:3px;background:#ffffff33;transition:background .2s}
.mk.on{background:var(--bad)}
.cams{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cam,.ev{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.cam b{font-size:18px}
.st{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:99px;font-size:14px;font-weight:600;background:#E7EBEF;color:var(--muted)}
.st.live{background:#D8EFE7;color:var(--ok)}
.cam dl{display:grid;grid-template-columns:auto auto;justify-content:space-between;margin:10px 0 0}
.cam dt{color:var(--muted)} .cam dd{margin:0;font-weight:600}
#queue{display:grid;gap:10px;padding:0;list-style:none;margin:0}
.ev{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.ev{grid-template-columns:150px 1fr}}
.thumb{background:#EEF1F4;border:1px dashed var(--line);border-radius:6px;min-height:84px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:var(--muted);font-size:14px}
.thumb img{width:100%;border-radius:6px;display:block}
.ev h3{margin:0;font-size:19px}
.meta{color:var(--muted);margin:2px 0 8px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:600;font-size:14px;background:#FCEBC0;color:#7A5600}
.chip.v{background:#D8EFE7;color:var(--ok)}
.empty{color:var(--muted);padding:18px;background:var(--panel);border:1px dashed var(--line);border-radius:8px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1 id="title">YUVATECH traffic control room</h1><p class="sub" id="sub"></p></div>
    <button id="replay" type="button">Replay run</button>
  </div>
  <p id="banner" hidden>Sample data. This page shows illustrative events, not output from a real pipeline run.</p>
  <p id="err" class="empty" hidden>Could not load data.json. Check that it sits next to index.html.</p>

  <section class="road" aria-label="Run timeline">
    <div class="row"><span>Run clock <b id="clock">00:00</b></span><span><span class="big" id="count">0</span> violations flagged</span></div>
    <div class="lane"><div class="fill" id="fill"></div><div id="marks"></div></div>
  </section>

  <h2>Cameras</h2>
  <div class="cams" id="cams"></div>

  <h2>Review queue</h2>
  <ul id="queue"></ul>
</main>
<script>
const $=s=>document.querySelector(s), SPEED=2;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label=t=>({NO_HELMET_VIOLATION:'No helmet',TRIPLE_RIDING_VIOLATION:'Triple riding',RED_LIGHT_VIOLATION:'Red light',NO_SEATBELT_VIOLATION:'No seatbelt'}[t]||t.replace(/_VIOLATION$/,'').replace(/_/g,' ').toLowerCase().replace(/^./,c=>c.toUpperCase()));
const status=s=>({needs_review:['Awaiting review',''],approved:['Approved by reviewer','v'],verified:['Verified','v'],rejected:['Rejected',''],escalated:['Escalated','']}[s]||[s,'']);
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
let D,dur,T=0,timer;

function render(){
  const shown=D.events.filter(e=>e.t<=T);
  $('#clock').textContent=fmt(T)+' of '+fmt(dur);
  $('#count').textContent=shown.length;
  $('#fill').style.width=(T/dur*100)+'%';
  document.querySelectorAll('.mk').forEach((m,i)=>m.classList.toggle('on',D.events[i].t<=T));
  $('#cams').innerHTML=D.cameras.map(c=>{
    const live=T>=1.5, n=shown.filter(e=>e.camera===c.id).length;
    return `<div class="cam"><b>${esc(c.id)}</b><span class="st ${live?'live':''}">${live?'Live':'Connecting'}</span>
      <dl><dt>Frames processed</dt><dd>${c.frames_total?Math.round(c.frames_total*Math.max(0,T-1.5)/Math.max(1,dur-1.5)).toLocaleString():'not recorded'}</dd><dt>Violations flagged</dt><dd>${n}</dd></dl></div>`;
  }).join('');
  $('#queue').innerHTML=shown.length?shown.slice().reverse().map(e=>{
    const [st,cls]=status(e.status);
    const img=e.evidence?`<img src="${esc(e.evidence)}" alt="Evidence frame for ${esc(label(e.type))}" loading="lazy">`:'No evidence image in this sample';
    return `<li class="ev"><div class="thumb">${img}</div><div><h3>${esc(label(e.type))}</h3>
      <p class="meta">${esc(e.camera)}, track ${esc(e.track)}, plate ${e.plate?esc(e.plate):'not read'}, confidence ${Math.round(e.conf*100)}%</p>
      <span class="chip ${cls}">${esc(st)}</span></div></li>`;
  }).join(''):'<li class="empty">Waiting for the first violation.</li>';
}
function start(){
  clearInterval(timer);T=0;render();
  timer=setInterval(()=>{T=Math.min(dur,T+0.1*SPEED);render();if(T>=dur)clearInterval(timer)},100);
}
fetch('data.json').then(r=>r.json()).then(d=>{
  D=d;dur=Math.max(...d.events.map(e=>e.t))+6;
  $('#title').textContent=d.meta.title;$('#sub').textContent=d.meta.subtitle;
  $('#banner').hidden=!d.meta.is_sample;
  $('#marks').innerHTML=d.events.map(e=>`<span class="mk" style="left:${e.t/dur*100}%"></span>`).join('');
  $('#replay').addEventListener('click',start);start();
}).catch(()=>{$('#err').hidden=false});
</script>
</body>
</html>
